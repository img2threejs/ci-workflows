name: Reusable Issue Triage

on:
  workflow_call:
    inputs:
      mode:
        description: "dry-run lists candidates; backfill writes notices."
        required: false
        default: dry-run
        type: string
      rollout-after:
        description: "ISO-8601 cutoff for backfill mode."
        required: false
        default: ""
        type: string
      script-path:
        description: "Path to issue_triage.py in the caller repo."
        required: false
        default: scripts/issue_triage.py
        type: string

permissions:
  contents: read
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Run issue triage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          args=()
          if [ "${{ inputs.mode }}" = "backfill" ] && [ -n "${{ inputs.rollout-after }}" ]; then
            args+=(--rollout-after "${{ inputs.rollout-after }}")
          elif [ "${{ inputs.mode }}" = "dry-run" ]; then
            args+=(--dry-run)
          fi
          python3 "${{ inputs.script-path }}" "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
