name: Reusable Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: Exact Python version used by the caller.
        required: true
        type: string
      test-command:
        description: Repository-owned test command to execute after checkout.
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Python CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Run caller test command
        run: ${{ inputs.test-command }}
